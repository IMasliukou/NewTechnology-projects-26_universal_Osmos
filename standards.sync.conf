# Настройки синхронизации со стандартами ModernTechnologies (база знаний).
# Этот файл коммитится в репозиторий, чтобы у всех был одинаковый источник правил.
# Значения можно переопределить одноимёнными переменными окружения.

# Git-URL репозитория-базы знаний со стандартами (обязательно заполнить).
# Примеры:
#   STANDARDS_REPO="https://github.com/IMasliukou/modtech-standards.git"
#   STANDARDS_REPO="git@github.com:IMasliukou/modtech-standards.git"
STANDARDS_REPO=""

# Ветка или тег базы знаний, из которого берём стандарты.
STANDARDS_REF="main"

# Путь ВНУТРИ репозитория-базы знаний, где лежат Cursor-правила (файлы *.mdc).
# Подгоните под реальную структуру папки standards/.
STANDARDS_SRC="standards/cursor-rules"
